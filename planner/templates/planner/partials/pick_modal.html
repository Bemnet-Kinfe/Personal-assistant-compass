{% load compass %}<div class="modal-wrap">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pick-title">
    <h2 id="pick-title">Add to {{ slot.1|lower }}, {{ date|day_phrase }}</h2>
    <p class="muted" style="margin:0; font-weight:600">Best fits first: deadlines, priority and energy for this part of the day.</p>
    {% include "planner/partials/pick_list.html" %}
    <div class="sheet-actions">
      <a class="btn" href="{% url 'task_new' %}?plan_date={{ date|date:'Y-m-d' }}&plan_slot={{ slot.0 }}" hx-get="{% url 'task_new' %}?plan_date={{ date|date:'Y-m-d' }}&plan_slot={{ slot.0 }}" hx-target="#modal">New task here</a>
      <button type="button" class="btn" data-close-modal>Done</button>
    </div>
  </div>
</div>
